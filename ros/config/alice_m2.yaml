# ALICE M2 (swerve base, 2 x YDLIDAR T-mini Pro 270..360 deg / 10 Hz).
#
# Structure (launch/alice_m2_odometry.launch.py, lidar_correction:=true):
#
#   odom --(this node: lidar correction)--> odom_ekf --(EKF)--> base_footprint
#
# The wheel + gyro EKF (robot_localization, the shared wio_ekf.yaml) runs with
# its frame renamed to odom_ekf and its topic remapped to /odometry/ekf. This
# node takes odom_ekf -> base_footprint as the motion prior, publishes only the
# correction odom -> odom_ekf (identity until the first scan, held if the lidars
# stop), and republishes the EKF odometry with the correction applied as
# /odometry/filtered in frame odom. SLAM, Nav2, docking and the health monitor
# keep their usual names; another robot running the same EKF without lidars is
# unaffected. The EKF does not consume this output, so there is no loop.
#
# For a bag recorded without this setup (EKF frame "odom"), run
#   alice_m2.launch.py bag_filename:=... wheel_odom_frame:=odom
#
# Holonomic options: see cpp/kinematic_icp/registration/Registration.hpp.
# Values below are the synthetic-check defaults (ros/tools/planar_check.cpp,
# 5 seeds: hall final 9.1 -> 1.0 cm, corridor 4.9 -> 3.8 cm against the prior
# alone; upstream unicycle 5.6 / 9.0 cm). Re-tune on robot bags.
/**:
  ros__parameters:
    lidar_topics: ["/ydlidar_front/scan", "/ydlidar_rear/scan"]
    use_2d_lidar: true
    # Beam time from the beam angle (utils::RetimeLaserCloudFromAngle). Read from
    # the YDLidar ROS 2 driver source and confirmed on robot bags: a revolution is
    # measured from scan angle 0 deg with the angle increasing and header.stamp is
    # its first node, but the array is binned from -180 deg, so index order is half
    # a revolution off. Synthetic YDLidar-timed bag (hall, 3 seeds): index timing
    # rms 1.5 cm / yaw max 1.36 deg, retimed 0.51 cm / 0.39 deg. Robot bags
    # 2026-10-01 (spin in place up to 75 deg/s and lab squares, both lidars matched
    # to a map of the standing start scans): index timing puts the scans 45 ms off
    # every odometry (ICP inlier 0.66-0.69), angle timing 0 deg increasing 0 ms
    # (inlier 0.88-0.92); decreasing is worse than either.
    laser_time_from_angle: true
    laser_time_origin_deg: 0.0
    laser_time_increasing: true
    base_frame: base_footprint
    wheel_odom_frame: odom_ekf    # EKF frame, used as the motion prior
    lidar_odom_frame: odom        # corrected frame the rest of the system uses
    publish_odom_tf: false        # pose TF base -> lidar_odom_frame (debug alternative)
    invert_odom_tf: true
    publish_correction_tf: true   # odom -> odom_ekf
    correction_tf_rate: 50.0      # [Hz]
    correction_tf_post_date: 0.05 # [s]
    corrected_odometry_input_topic: /odometry/ekf
    corrected_odometry_output_topic: /odometry/filtered
    # Standing frames are still checked against the scans (LidarOdometryServer::RegisterFrame).
    # The prior's heading is the gyro alone, so a turn it shows while the robot does not move
    # counts only if these wheels turn too, once kept up 0.5 s. Robot 2026-10-28 (KG): the
    # gyro read +0.5 deg/s for 3 to 7 s at a time while the base stood or crept (lidar and
    # wheels 0 deg/s), carried as slow motion: heading 11 deg off. Offline, heading against
    # the map: max 11.5 -> 8.6 deg, end 11.1 -> 6.3 deg; the 1001/1002 tape bags unchanged
    # (no frame affected, 4.73 cm). Empty: the prior alone.
    standing_odometry_topic: /aeirobot/alice_mobile/odom
    # The prior and the deskew motion are looked up at the scan end; give the EKF
    # TF this long to arrive (upstream uses 0 on hardware, i.e. identity on a miss).
    tf_timeout: 0.05

    # Preprocessing
    max_range: 12.0               # T-mini Pro spec (80 % reflectivity)
    min_range: 0.05
    # Mapping
    voxel_size: 0.25
    max_points_per_voxel: 20
    # Correspondence threshold
    use_adaptive_threshold: true
    fixed_threshold: 1.0
    # Registration
    max_num_iterations: 10
    convergence_criterion: 0.001
    max_num_threads: 1
    use_adaptive_odometry_regularization: true   # damping mode only
    fixed_regularization: 0.0
    deskew: true

    # Holonomic (x, y, yaw) with the odometry as a Gaussian prior and
    # point-to-line residuals.
    holonomic: true
    odometry_prior: true
    point_to_line: true
    point_sigma: 0.01             # [m] per correspondence; larger trusts the scan less
    prior_sigma_xy_floor: 0.001   # [m] per frame
    prior_sigma_x_rel: 0.01       # x: 1 % of |dx| per frame (wheels hold travel well)
    prior_sigma_y_rel: 0.05       # y: 5 % of |dy| per frame (crab slip)
    prior_sigma_yaw_floor: 0.0005 # [rad] per frame (gyro)
    prior_sigma_yaw_rel: 0.02
    normal_radius: 0.2            # [m]
    normal_min_points: 4
    normal_max_eigen_ratio: 0.05
    point_to_point_weight: 0.0    # 0.1 helped some synthetic corridors, hurt others
    regularization_weight_x: 1.0  # damping mode only
    regularization_weight_y: 1.0
    regularization_weight_yaw: 0.0

    # Leave out points that move with the robot (someone walking behind it), see
    # moving_object_filter in cpp/kinematic_icp/pipeline/KinematicICP.hpp. Offline
    # check on the 1001/1002 test bags (3 runs each, error vs scan reference or tape)
    # together with prior_sigma_x_rel 0.01: mean 5.0 cm / 0.50 deg, before 14.6 cm /
    # 0.89 deg (the 1002 straight run with someone following: 66 -> 9 cm).
    moving_object_filter: true
    moving_object_min_motion: 0.7        # [m] robot travel to the frame compared with
    moving_object_same_tolerance: 0.3    # [m] still at the same place in the robot frame
    moving_object_static_tolerance: 0.3  # [m] and not where a fixed point would be
    moving_object_history: 200           # frames (both lidars, 20 per second)
    # Robot body: by default the box spanned by the lidar mounts (they sit on opposite
    # corners); moving_object_footprint: [min_x, max_x, min_y, max_y] overrides it.
    # Blind sectors: the lidar driver's ignore_array, read by the launch files from
    # the ydlidar_ros2_driver parameter files and asked from the running driver.

    # Lidar degeneracy, published every frame on /kinematic_icp/degeneracy
    # (diagnostic_msgs/DiagnosticArray, level WARN while degenerate), see
    # cpp/kinematic_icp/registration/Degeneracy.hpp. The scan-only information of the
    # frames registered in the last window: "corridor" when lambda_min / lambda_max of
    # the position information drops below ratio_enter (the position along weak_axis_deg
    # then rests on the wheels), "sparse" when too few line matches (open space).
    # Starting values (2026-10-19): the robot corridor bags of 2026-10-01/02
    # (~/alice_log straight_01..03, crab_01) fall below 0.05 deep in the corridor and
    # stay above 0.1 at the junction; registered frames there had 17..34 matches.
    # Synthetic check (tools/planar_check.cpp, 3 seeds): 1 m corridor 100 % flagged
    # along 0 deg, hall 0 % after the first second (empty map). Re-tune on robot runs.
    degeneracy_window: 1.0            # [s]
    degeneracy_ratio_enter: 0.05
    degeneracy_ratio_exit: 0.10
    degeneracy_min_matches_enter: 8.0 # mean matches per registered frame
    degeneracy_min_matches_exit: 12.0
    degeneracy_min_frames: 5          # fewer registered frames in the window: not judged (start-up)

    # Odometry message covariance
    covariance_from_registration: false
    covariance_scale: 1.0
    position_covariance: 0.1
    orientation_covariance: 0.1
